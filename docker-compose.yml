# Default always-on deployment: runs the released image from ghcr.io and serves MCP over HTTP.
# To run a local build instead: make docker, then set image: dockhand-mcp (or add build: .).
# Secrets (DOCKHAND_TOKEN, DOCKHAND_AUTH_TOKEN) come from a gitignored .env next to this file,
# see .env.example. Then register it in Claude Code:
#   claude mcp add --transport http dockhand http://<host>:8080/mcp \
#     --header "Authorization: Bearer <DOCKHAND_AUTH_TOKEN>"

networks:
  net:
    name: net

services:
  dockhand-mcp:
    image: ghcr.io/katbyte/dockhand-mcp:latest
    container_name: dockhand-mcp
    restart: always
    logging:
      options:
        max-size: 100m
        max-file: "1"
    networks:
      net:
    # no dns override: the container uses Docker's resolver, which forwards to
    # the host's, so a name in DOCKHAND_SERVER resolves the way it does on the
    # host, and a Dockhand on the same network is reached by its service name
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - "TZ=America/Vancouver"
      - "DOCKHAND_SERVER=http://dockhand:3000"
      - "DOCKHAND_LISTEN=:8080"
      - "DOCKHAND_LOG=INFO"
      # - "DOCKHAND_TOOLSETS=all"          # every tool; default core
      # - "DOCKHAND_ENABLE_WRITE=true"     # register the tools that change something; without it every tool only reads
      # - "DOCKHAND_ENABLE_DELETE=true"    # and the tools that delete; needs DOCKHAND_ENABLE_WRITE too
